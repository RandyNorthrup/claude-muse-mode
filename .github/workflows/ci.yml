name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools (actionlint, gitleaks)
        shell: pwsh
        run: |
          choco install actionlint gitleaks -y --no-progress

      - name: Gates (lint, tests, shim, secrets, workflows)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./gates.ps1 -Strict
