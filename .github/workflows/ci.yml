name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools (actionlint)
        shell: pwsh
        run: |
          choco install actionlint -y --no-progress

      - name: Gates (lint, tests, shim, secrets, workflows)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./gates.ps1 -Strict

      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
